services:
  db:
    image: mysql:9.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant_analytics
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant
    ports:
      - "3308:3306"
    volumes:
      - restaurant_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  restaurant_mysql_data:
